name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Dependências e Capacitor
        run: |
                    npm install
          npx cap sync android

      - name: Compilar APK de Debug
        run: |
          cd meu-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: meu-app/android/app/build/outputs/apk/debug/app-debug.apk
